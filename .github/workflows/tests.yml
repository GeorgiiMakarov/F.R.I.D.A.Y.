name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Step 2: pilot mode needs the ed25519 extra; the core stays
      # stdlib-only, this installs only the optional dependency.
      - run: python3 -m pip install -e .[ed25519]
      - run: python3 -m unittest discover -s tests -v
